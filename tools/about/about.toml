# The crate licence report ([052]): `just licences` writes assets/licenses/third-party.md,
# which ships with the app (the whole assets folder does).
targets = ["aarch64-linux-android", "aarch64-apple-ios", "wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]
