plugins {
    alias(libs.plugins.android.application)
}

// The app version is the root Cargo.toml version (D12); versionCode = major*10000 + minor*100 + patch.
def cargoVersion = file('../../../Cargo.toml').readLines().find { it.startsWith('version = ') }.split('"')[1]
def (major, minor, patch) = cargoVersion.tokenize('.').collect { it.toInteger() }

android {
    namespace 'top.cosas.rix'
    compileSdk 36
    // The NDK that cargo-ndk builds with: Gradle strips the Rust library with it and keeps
    // its symbols for Play ([105]).
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'top.cosas.rix'
        minSdk 31
        targetSdk 36
        versionCode major * 10000 + minor * 100 + patch
        versionName cargoVersion
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        release {
            // The upload key ([054]): `just android-release` reads it from `.env`.
            def keystore = System.getenv('RIX_UPLOAD_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('RIX_UPLOAD_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('RIX_UPLOAD_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            // The Rust library's function names go into the bundle for Play's crash reports
            // ([105]); FULL would add some 500 MB of line tables.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        prefab true
    }
    sourceSets {
        main {
            // The game's assets ship inside the APK; `just android` puts the Rust
            // library in `jniLibs` (gitignored).
            assets.srcDirs += files('../../../assets')
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.games.activity
}
