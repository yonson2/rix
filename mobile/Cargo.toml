version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Rix as a library for the Android and iOS projects ([021], [020])"

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { version = "0.20.1", features = ["android-game-activity"] }
rix = { path = ".." }
