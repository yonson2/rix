[package]
name = "rix"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.2.1"
bevy = "0.15.3"
rand = "0.8.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
