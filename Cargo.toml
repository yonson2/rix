[package]
name = "rix"
version = "0.4.7"
edition = "2024"

[workspace]
# The mobile library ([021]); `cargo build` in the root builds only `rix`.
members = ["mobile"]

[dependencies]
avian2d = { version = "0.8.0", features = ["enhanced-determinism"] }
bevy = "0.20.1"
fastrand = "2.3.0"
lyon_algorithms = "1.0.5"
lyon_tessellation = "1.0.15"
# The save file ([048]).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
# Release builds (also the mobile release builds) compile `info!` and lower out ([026]).
log = { version = "0.4.35", features = ["release_max_level_warn"] }
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }

# Haptics ([081]): JNI to `MainActivity.haptic`; UIKit's impact generator.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.2.2", features = ["NSThread"] }
objc2-ui-kit = { version = "0.2.2", features = ["UIFeedbackGenerator", "UIImpactFeedbackGenerator"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# objc2 0.5 (winit 0.30.9) checks message return types in debug builds; on macOS 27 the
# NSArray enumeration check fails ('q' vs 'Q') and the app panics at start ([006] Notes).
[profile.dev.package.objc2]
debug-assertions = false

# CI ([008]): no optimisation, line tables only, so a cold build is fast.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[features]
# Dev-only tools (src/dev_tools.rs, [006]). Turns on no Bevy feature, so it reuses the
# normal build artifacts.
dev_tools = []

dev = [
  "dev_tools",
  # Improve compile times for dev builds by linking Bevy as a dynamic library.
  "bevy/dynamic_linking",
]

dev_native = [
  "dev",
  # Enable asset hot reloading for native dev builds.
  "bevy/file_watcher",
  # Enable embedded asset hot reloading for native dev builds.
  "bevy/embedded_watcher",
]

# From bevy_new_2d ([035]).
[lints.clippy]
# Bevy passes system parameters by injection, so a system often takes more than 7.
too_many_arguments = "allow"
# A query names many components.
type_complexity = "allow"
# unchecked_duration_subtraction = "warn"
# unwrap_used = "warn"
# expect_used = "warn"
# panicking_unwrap = "warn"
# option_env_unwrap = "warn"
# indexing_slicing = "warn"
# join_absolute_paths = "warn"
# serde_api_misuse = "warn"
# uninit_vec = "warn"
# transmute_int_to_char = "warn"
# transmute_int_to_float = "warn"
# transmute_ptr_to_ref = "warn"
# transmute_undefined_repr = "warn"
