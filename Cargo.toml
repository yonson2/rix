[package]
name = "rix"
version = "0.2.2"
edition = "2024"

[dependencies]
avian2d = "0.3.1"
bevy = "0.16.1"
fastrand = "2.3.0"
lyon_algorithms = "1.0.5"
lyon_tessellation = "1.0.15"

# Used by `dev_tools` only (gives the focus back on macOS). Not optional: winit builds the
# same crates, and one feature set for every build keeps one set of artifacts.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = "0.2.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# objc2 0.5 (winit 0.30.9) checks message return types in debug builds; on macOS 27 the
# NSArray enumeration check fails ('q' vs 'Q') and the app panics at start ([006] Notes).
[profile.dev.package.objc2]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[features]
# Dev-only tools (src/dev_tools.rs, [006]). Turns on no Bevy feature, so it reuses the
# normal build artifacts.
dev_tools = []

dev = [
  "dev_tools",
  # Improve compile times for dev builds by linking Bevy as a dynamic library.
  "bevy/dynamic_linking",
]

dev_native = [
  "dev",
  # Enable asset hot reloading for native dev builds.
  "bevy/file_watcher",
  # Enable embedded asset hot reloading for native dev builds.
  "bevy/embedded_watcher",
]

